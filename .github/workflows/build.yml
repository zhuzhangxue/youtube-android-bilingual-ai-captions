name: Build bilingual captions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apply_bilingual_patch.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  packages: read

env:
  UPSTREAM_TAG: v1.5.1
  VERSION: 1.0.4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Checkout Anchored AI Captions
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/YYDarlinker/morphe-ai-caption-translator.git upstream

      - name: Apply bilingual changes
        run: python3 apply_bilingual_patch.py upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Morphe bundle
        working-directory: upstream
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Collect installable .mpp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t files < <(find upstream/build/n39/gradle/patches/libs -maxdepth 1 -type f -name '*.mpp' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one .mpp, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          cp "${files[0]}" out/anchored-ai-captions-bilingual.mpp
          sha256sum out/anchored-ai-captions-bilingual.mpp > out/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchored-ai-captions-bilingual
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish raw bundle branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf publish
          git worktree add --detach publish
          cd publish
          git checkout --orphan dist-build
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp ../out/anchored-ai-captions-bilingual.mpp "anchored-ai-captions-bilingual-$VERSION.mpp"
          cp ../out/SHA256SUMS.txt .
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit -m "dist: bilingual captions $VERSION"
          git push origin HEAD:dist --force

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/anchored-ai-captions-bilingual.mpp out/SHA256SUMS.txt --clobber
          else
            gh release create "$tag"               out/anchored-ai-captions-bilingual.mpp               out/SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "YouTube Android Bilingual AI Captions $VERSION"               --notes "Context-aware bilingual captions for Morphe / YouTube 21.20.405. Based on Anchored AI Captions v1.5.1."
          fi

      - name: Verify remote-source download
        run: |
          curl -fL --retry 3 --retry-delay 2             -o /tmp/remote.mpp             "https://github.com/zhuzhangxue/youtube-android-bilingual-ai-captions/releases/download/v$VERSION/anchored-ai-captions-bilingual.mpp"
          test -s /tmp/remote.mpp
