name: Build bilingual captions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apply_bilingual_patch.py"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: read

env:
  UPSTREAM_TAG: v1.5.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Anchored AI Captions
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/YYDarlinker/morphe-ai-caption-translator.git upstream

      - name: Apply bilingual changes
        run: python3 apply_bilingual_patch.py upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Morphe bundle
        working-directory: upstream
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Collect installable .mpp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t files < <(find upstream/build/n39/gradle/patches/libs -maxdepth 1 -type f -name '*.mpp' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one .mpp, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          cp "${files[0]}" out/anchored-ai-captions-bilingual.mpp
          sha256sum out/anchored-ai-captions-bilingual.mpp > out/SHA256SUMS.txt

      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: anchored-ai-captions-bilingual
          path: out/*
          if-no-files-found: error
          retention-days: 30
